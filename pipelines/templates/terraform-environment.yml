parameters:
  - name: environment
    type: string
  # Both IDs are printed by bootstrap/terraform (output service_connection_ids); the names follow its convention.
  - name: planServiceConnectionId
    type: string
  - name: applyServiceConnectionId
    type: string
  - name: namePrefix
    type: string
    default: andes
  - name: dependsOn
    type: object
    default: []

stages:
  - stage: plan_${{ parameters.environment }}
    displayName: Plan ${{ parameters.environment }}
    dependsOn: ${{ parameters.dependsOn }}
    # Runs on PRs even though the previous environment's main-only stages are skipped.
    condition: and(not(failed()), not(canceled()))
    jobs:
      - job: plan
        displayName: terraform plan
        steps:
          - checkout: self
            fetchDepth: 1

          - template: steps-install-terraform.yml

          # PR branches run their own YAML before anyone reviews it, so plans only ever get the read-only identity.
          - template: steps-terraform.yml
            parameters:
              name: tfplan
              displayName: terraform plan
              serviceConnection: ${{ parameters.namePrefix }}-sc-${{ parameters.environment }}-plan
              serviceConnectionId: ${{ parameters.planServiceConnectionId }}
              script: |
                terraform fmt -check -recursive
                terraform init -backend-config=environments/${{ parameters.environment }}/backend.hcl
                terraform validate

                # The plan identity can read state but not lease it; apply still locks and rejects a stale plan.
                exit_code=0
                terraform plan -lock=false \
                  -var-file=environments/${{ parameters.environment }}/terraform.tfvars \
                  -out=tfplan -detailed-exitcode || exit_code=$?
                if [ "$exit_code" -eq 1 ]; then exit 1; fi

                has_changes=false
                if [ "$exit_code" -eq 2 ]; then has_changes=true; fi
                echo "##vso[task.setvariable variable=hasChanges;isOutput=true]$has_changes"

          # Saved plans hold variable values in cleartext, and only main-branch plans are ever applied.
          - publish: $(Build.SourcesDirectory)/terraform/tfplan
            artifact: tfplan-${{ parameters.environment }}
            displayName: Publish plan
            condition: >-
              and(
                succeeded(),
                eq(variables['tfplan.hasChanges'], 'true'),
                eq(variables['Build.SourceBranch'], 'refs/heads/main')
              )

  # Approval, main-only branch control and the exclusive lock sit on the apply service connection, where pipeline
  # YAML can't bypass them. Checks run once per stage, so the grant job shares the apply job's approval.
  - stage: apply_${{ parameters.environment }}
    displayName: Apply ${{ parameters.environment }}
    dependsOn: plan_${{ parameters.environment }}
    condition: >-
      and(
        succeeded(),
        eq(variables['Build.SourceBranch'], 'refs/heads/main'),
        eq(dependencies.plan_${{ parameters.environment }}.outputs['plan.tfplan.hasChanges'], 'true')
      )
    jobs:
      # The Azure DevOps Environment only records deployment history.
      - deployment: apply
        displayName: terraform apply
        environment: ${{ parameters.namePrefix }}-${{ parameters.environment }}
        strategy:
          runOnce:
            deploy:
              steps:
                - checkout: self
                  fetchDepth: 1

                - download: current
                  artifact: tfplan-${{ parameters.environment }}
                  displayName: Download plan

                - template: steps-install-terraform.yml

                - template: steps-terraform.yml
                  parameters:
                    displayName: terraform apply
                    serviceConnection: ${{ parameters.namePrefix }}-sc-${{ parameters.environment }}-apply
                    serviceConnectionId: ${{ parameters.applyServiceConnectionId }}
                    script: |
                      terraform init -backend-config=environments/${{ parameters.environment }}/backend.hcl
                      terraform apply -lock-timeout=5m "$(Pipeline.Workspace)/tfplan-${{ parameters.environment }}/tfplan"

      # A separate job so "Rerun failed jobs" retries a failed grant without re-applying a now-stale plan.
      - job: grant
        displayName: Grant API identity database access
        dependsOn: apply
        steps:
          - checkout: self
            fetchDepth: 1

          - template: steps-install-terraform.yml

          - template: steps-terraform.yml
            parameters:
              displayName: Read Terraform outputs
              serviceConnection: ${{ parameters.namePrefix }}-sc-${{ parameters.environment }}-apply
              serviceConnectionId: ${{ parameters.applyServiceConnectionId }}
              script: |
                terraform init -backend-config=environments/${{ parameters.environment }}/backend.hcl
                terraform output -json sql_access > "$(Agent.TempDirectory)/sql-access.json"

          - task: AzurePowerShell@5
            displayName: Create contained database user
            inputs:
              azureSubscription: ${{ parameters.namePrefix }}-sc-${{ parameters.environment }}-apply
              azurePowerShellVersion: LatestVersion
              pwsh: true
              ScriptType: InlineScript
              Inline: |
                Install-PSResource -Name SqlServer -Version $env:SQLSERVER_MODULE_VERSION -Repository PSGallery `
                  -TrustRepository -Scope CurrentUser -Quiet
                $access = Get-Content -Raw "$env:AGENT_TEMPDIRECTORY/sql-access.json" | ConvertFrom-Json
                & "$env:BUILD_SOURCESDIRECTORY/scripts/Grant-SqlManagedIdentityAccess.ps1" `
                  -ResourceGroupName $access.resource_group_name `
                  -SqlServerName $access.server_name `
                  -DatabaseName $access.database_name `
                  -PrincipalName $access.principal_name `
                  -PrincipalClientId $access.principal_client_id `
                  -AddRunnerFirewallRule
            env:
              SQLSERVER_MODULE_VERSION: $(sqlServerModuleVersion)
