# Runs Terraform with workload identity federation. The azurerm provider and backend request fresh
# ADO OIDC tokens themselves, so long applies outlive the short-lived federated token.
parameters:
  - name: displayName
    type: string
  - name: serviceConnection
    type: string
  - name: serviceConnectionId
    type: string
  - name: script
    type: string
  - name: name
    type: string
    default: ''
  # Extra environment variables, e.g. secret variables, which Azure DevOps never maps into env on its own.
  - name: env
    type: object
    default: {}

steps:
  - task: AzureCLI@2
    displayName: ${{ parameters.displayName }}
    ${{ if ne(parameters.name, '') }}:
      name: ${{ parameters.name }}
    inputs:
      azureSubscription: ${{ parameters.serviceConnection }}
      scriptType: bash
      scriptLocation: inlineScript
      addSpnToEnvironment: true
      workingDirectory: $(Build.SourcesDirectory)/terraform
      inlineScript: |
        set -euo pipefail
        export ARM_CLIENT_ID="$servicePrincipalId"
        export ARM_TENANT_ID="$tenantId"
        ${{ parameters.script }}
    env:
      ARM_USE_OIDC: 'true'
      ARM_USE_AZUREAD: 'true'
      ARM_ADO_PIPELINE_SERVICE_CONNECTION_ID: ${{ parameters.serviceConnectionId }}
      ARM_OIDC_AZURE_SERVICE_CONNECTION_ID: ${{ parameters.serviceConnectionId }}
      SYSTEM_ACCESSTOKEN: $(System.AccessToken)
      SYSTEM_OIDCREQUESTURI: $(System.OidcRequestUri)
      TF_IN_AUTOMATION: 'true'
      TF_INPUT: '0'
      ${{ each variable in parameters.env }}:
        ${{ variable.key }}: ${{ variable.value }}
