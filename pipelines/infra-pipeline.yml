# Infrastructure pipeline: PRs plan every environment with read-only identities; main also applies (behind the
# checks on each apply service connection) and grants the API identity SQL access. Add an environment by
# appending one template call.

name: infra-$(Date:yyyyMMdd)$(Rev:.r)

trigger:
  batch: true
  branches:
    include:
      - main
  paths:
    include:
      - terraform
      - pipelines
      - scripts

# Honoured for GitHub/Bitbucket repos only; with Azure Repos, add this pipeline as a build validation
# branch policy on main instead.
pr:
  branches:
    include:
      - main
  paths:
    include:
      - terraform
      - pipelines
      - scripts

pool:
  vmImage: ubuntu-24.04

variables:
  - name: terraformVersion
    value: 1.16.5
  # SHA256 of terraform_<version>_linux_amd64.zip from releases.hashicorp.com; update together with the version.
  - name: terraformSha256
    value: 2bc2fcfff033265c9e02ca0351f01794eb122f62a9b2a49a3294b9e49eaab5e4
  - name: sqlServerModuleVersion
    value: 22.4.5.1

stages:
  - template: templates/terraform-environment.yml
    parameters:
      environment: dev
      # Printed by bootstrap/terraform (output service_connection_ids); not secrets.
      planServiceConnectionId: eac72fef-fa08-4c5d-ae3e-a9efe5c52889
      applyServiceConnectionId: 304284d3-c8e6-4aa5-8a16-aeafadcda168

  # Promote to the next environment after dev is applied, e.g.:
  # - template: templates/terraform-environment.yml
  #   parameters:
  #     environment: qa
  #     planServiceConnectionId: 00000000-0000-0000-0000-000000000000
  #     applyServiceConnectionId: 00000000-0000-0000-0000-000000000000
  #     dependsOn: [apply_dev]
