# Infrastructure pipeline: PRs plan every environment with read-only identities; main also applies (behind the
# approvers on each Azure DevOps Environment and the checks on each apply service connection) and grants the API
# identity SQL access. Add an environment by appending one template call.

name: infra-$(Date:yyyyMMdd)$(Rev:.r)

trigger:
  # Not batched: a run waiting on an approval counts as running, so batching would hold every later merge back from dev.
  batch: false
  branches:
    include:
      - main
  paths:
    include:
      - terraform
      - pipelines
      - scripts

# Honoured for GitHub/Bitbucket repos only; with Azure Repos, add this pipeline as a build validation
# branch policy on main instead.
pr:
  branches:
    include:
      - main
  paths:
    include:
      - terraform
      - pipelines
      - scripts

pool:
  vmImage: ubuntu-24.04

variables:
  - name: terraformVersion
    value: 1.16.5
  # SHA256 of terraform_<version>_linux_amd64.zip from releases.hashicorp.com; update together with the version.
  - name: terraformSha256
    value: 2bc2fcfff033265c9e02ca0351f01794eb122f62a9b2a49a3294b9e49eaab5e4
  - name: sqlServerModuleVersion
    value: 22.4.5.1

stages:
  - template: templates/terraform-environment.yml
    parameters:
      environment: dev
      # Printed by bootstrap/terraform (output service_connection_ids); not secrets.
      planServiceConnectionId: 53f1a67e-3355-46c2-a6e7-9e76ecafdf18
      applyServiceConnectionId: 1da5b51f-af1f-4cbd-8560-d8215c820a30

  # Each environment after dev waits for the approvers set on its Azure DevOps Environment.
  - template: templates/terraform-environment.yml
    parameters:
      environment: qa
      planServiceConnectionId: 85914c19-42ba-41bc-a286-b78eafb22941
      applyServiceConnectionId: c37f856b-f3bb-4610-a9c3-0d7557ecf821
      dependsOn: [apply_dev]

  - template: templates/terraform-environment.yml
    parameters:
      environment: uat
      planServiceConnectionId: 0fac6d8d-1c29-441c-904c-235fb632b61d
      applyServiceConnectionId: 1a10a10a-66ad-4a16-bc89-ff711bb340e1
      dependsOn: [apply_qa]

  - template: templates/terraform-environment.yml
    parameters:
      environment: staging
      planServiceConnectionId: 8b6900e0-d219-435b-b60a-bb8b8417838b
      applyServiceConnectionId: 338afdc2-c9aa-4f3b-82a6-1861b9799671
      dependsOn: [apply_uat]

  - template: templates/terraform-environment.yml
    parameters:
      environment: prod
      planServiceConnectionId: f450303e-2bda-4b4a-8d8a-6f4114f51519
      applyServiceConnectionId: 74a309c5-06c3-4224-909e-2f5e7a4adb33
      dependsOn: [apply_staging]
