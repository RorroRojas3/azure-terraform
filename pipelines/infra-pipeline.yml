# Infrastructure pipeline: PRs plan every environment with read-only identities; main also applies (behind the
# approvers on each Azure DevOps Environment and the checks on each apply service connection) and grants the API
# identity SQL access. Add an environment by appending one template call.

name: infra-$(Date:yyyyMMdd)$(Rev:.r)

trigger:
  # Not batched: a run waiting on an approval counts as running, so batching would hold every later merge back from dev.
  batch: false
  branches:
    include:
      - main
  paths:
    include:
      - terraform
      - pipelines
      - scripts

# Honoured for GitHub/Bitbucket repos only; with Azure Repos, add this pipeline as a build validation
# branch policy on main instead. No path filter: main's branch protection requires this run's check, and a PR
# the trigger skipped could never report it.
pr:
  branches:
    include:
      - main

pool:
  vmImage: ubuntu-24.04

variables:
  - name: terraformVersion
    value: 1.16.5
  # SHA256 of terraform_<version>_linux_amd64.zip from releases.hashicorp.com; update together with the version.
  - name: terraformSha256
    value: 2bc2fcfff033265c9e02ca0351f01794eb122f62a9b2a49a3294b9e49eaab5e4
  - name: sqlServerModuleVersion
    value: 22.4.5.1

stages:
  - template: templates/terraform-environment.yml
    parameters:
      environment: dev
      # Printed by bootstrap/terraform (output service_connection_ids); not secrets.
      planServiceConnectionId: f0ac7316-c8d2-4dfc-8a87-11c13da2c724
      applyServiceConnectionId: deb0e162-903c-462e-99a2-c6b65a367529

  # Each environment after dev waits for the approvers set on its Azure DevOps Environment.
  - template: templates/terraform-environment.yml
    parameters:
      environment: qa
      planServiceConnectionId: 55900da4-27c4-4526-9165-91172ee41b1e
      applyServiceConnectionId: dad1cb80-23c6-4327-a72c-df0c2d2d85bd
      dependsOn: [apply_dev]

  - template: templates/terraform-environment.yml
    parameters:
      environment: uat
      planServiceConnectionId: 29062418-48c4-4839-a2eb-ab3ef0e349c5
      applyServiceConnectionId: 914441db-1d38-4a74-a500-8ed6e0378a44
      dependsOn: [apply_qa]

  - template: templates/terraform-environment.yml
    parameters:
      environment: staging
      planServiceConnectionId: b4061f30-1864-4d87-86ce-b004469dead8
      applyServiceConnectionId: ba3b5869-264f-4970-a084-ac786a17a21b
      dependsOn: [apply_uat]

  - template: templates/terraform-environment.yml
    parameters:
      environment: prod
      planServiceConnectionId: 68f616f0-e595-4092-873d-8bcfcb0b8b22
      applyServiceConnectionId: 3e7472dc-c343-4d1e-821c-3cdfc0c6a901
      dependsOn: [apply_staging]
